<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessX</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="lobby" class="screen">
      <div class="panel">
        <h1>Chess<span>X</span></h1>
        <label>
          Your name
          <input id="name" maxlength="24" placeholder="Player" autocomplete="off" />
        </label>
        <button id="create" class="primary">Create game</button>
        <button id="solo" class="secondary">Practice: play both sides</button>
        <div class="or">or join with a code</div>
        <div class="row">
          <input id="code" maxlength="5" placeholder="CODE" autocomplete="off" />
          <button id="join">Join</button>
        </div>
        <p id="lobby-error" class="error"></p>
        <p id="conn" class="conn">connecting…</p>
      </div>
    </div>

    <div id="game" class="screen hidden">
      <aside id="inspect">
        <div id="zoom" class="zoom empty">
          <div class="zoom-empty">Click any piece to see its card.</div>
        </div>
        <button id="stance" disabled>Switch to Defense mode</button>
        <div id="stance-hint" class="hint"></div>
      </aside>
      <div id="board-mount"></div>
      <aside id="side">
        <div class="side-block">
          <div class="label">Invite code</div>
          <div id="room-code" class="code">-----</div>
          <div id="room-hint" class="hint">Send this to a friend. They enter it under "Join".</div>
        </div>
        <div class="side-block players">
          <div id="opp" class="player">
            <div class="who"><span class="dot"></span><span class="pname">Waiting for opponent…</span></div>
            <div class="counts"><span class="hand">Hand: –</span> <span class="deck">Deck: –</span></div>
          </div>
          <div id="status" class="status">Waiting for an opponent to join.</div>
          <div id="turn-track" class="turn-track hidden">
            <span id="track-major" class="track">Move / Summon</span>
            <span class="track ok">Spells: any</span>
            <span class="track ok">Stance: any</span>
          </div>
          <button id="end-turn" class="primary end-turn" disabled>End Turn</button>
          <div id="me" class="player">
            <div class="who"><span class="dot"></span><span class="pname">You</span></div>
            <div class="counts"><span class="hand">Hand: –</span> <span class="deck">Deck: –</span></div>
          </div>
        </div>
        <div class="side-block grow">
          <div class="label">Log</div>
          <div id="log"></div>
        </div>
        <div class="side-block actions">
          <button id="resign" class="danger">Resign</button>
          <button id="leave">Leave</button>
        </div>
      </aside>
    </div>

    <div id="chat" class="chat faded hidden">
      <div id="chat-log" class="chat-log" title="Click to expand"></div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="240" placeholder="Say something… (Enter to send)" />
      </form>
    </div>

    <div id="toast" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
