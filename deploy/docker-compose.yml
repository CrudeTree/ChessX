# ChessX on a VPS (e.g. a DigitalOcean droplet).
#
#   cd /opt/chessx && cp deploy/.env.example deploy/.env   # edit PUBLIC_URL etc.
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The app listens on 127.0.0.1:8080 only; put your existing reverse proxy
# (nginx / Caddy) in front of it — see nginx.conf.example / Caddyfile.example.
# The SQLite database lives in the named volume `chessx_data`.

services:
  chessx:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chessx
    restart: unless-stopped
    ports:
      # Host port is configurable (HOST_PORT in deploy/.env) in case 8080 is taken on the box.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_PATH: /data/chessx.sqlite
      PORT: "8080"
    volumes:
      - chessx_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/auth/providers"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chessx_data:
