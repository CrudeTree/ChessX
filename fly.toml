# Fly.io config. Deploy with:
#   fly launch --no-deploy   (once; creates the app, keep this file)
#   fly volumes create chessx_data --size 1
#   fly secrets set PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
app = "chessx"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/chessx.sqlite"

[[mounts]]
  source = "chessx_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/auth/providers"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
